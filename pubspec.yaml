name: travesias_conecta
description: Aplicación Flutter basada en los mockups de Travesías Conecta.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.3.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_universidad_amazonia.png
    - assets/images/logo_ingenieria_sistemas.png
    - assets/images/logo_red_comunitaria.png
